# OS postgres can administer only through the private Unix socket and peer map.
local   all     whoop_admin                         peer map=whoop_admin
local   all     all                                 reject
# Authentication is mandatory for every network client. No host trust fallback.
hostnossl all    all               0.0.0.0/0         reject
hostnossl all    all               ::/0              reject
hostssl whoop   whoop_migrate      0.0.0.0/0         scram-sha-256
hostssl whoop   whoop_migrate      ::/0              scram-sha-256
hostssl whoop   whoop_runtime      0.0.0.0/0         scram-sha-256
hostssl whoop   whoop_runtime      ::/0              scram-sha-256
host    all     all               0.0.0.0/0         reject
host    all     all               ::/0              reject
host    replication all           0.0.0.0/0         reject
host    replication all           ::/0              reject
